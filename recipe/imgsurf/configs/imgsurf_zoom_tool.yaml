tools:
  - class_name: verl.tools.imgsurf_zoom_tool.ImgSurfZoomTool
    config:
      coordinate_scale: 1000
      max_iter: 4
      expand_ratio: 0.4
      iou_threshold: 0.5
      resize_factor: 32
      min_pixels: 1024
      max_pixels: 4194304
      type: native
    tool_schema:
      type: function
      function:
        name: image_zoom_in_tool
        description: >-
          Select and recursively refine a region needed to answer the question. Coordinates are
          normalized to [0,1000] relative to the original image; the tool returns the final crop.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items:
                type: number
              minItems: 4
              maxItems: 4
              description: Normalized [x1,y1,x2,y2] in the original image, each value in [0,1000].
            label:
              type: string
              description: Short name of the object or evidence to inspect.
          required: [bbox_2d]
